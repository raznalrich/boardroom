<header class="btb-header" *ngIf="isVisible">
  <!-- Tier 1: Top Utility Bar -->
  <div class="top-utility-bar">
    <div class="container utility-inner">
      <div class="edition-tag">{{ editionLabel() }}</div>
    </div>
  </div>

  <!-- Tier 2: Main Brand Masthead -->
  <div class="masthead-bar">
    <div class="container masthead-inner">
      <!-- Mobile menu button (shown on phones/tablets only) -->
      <button class="mobile-menu-btn" type="button" (click)="toggleMobileMenu()" [attr.aria-expanded]="isMobileMenuOpen" aria-label="Toggle menu">
        @if (!isMobileMenuOpen) {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
        } @else {
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        }
      </button>

      <!-- Brand Logo (Left) -->
      <a routerLink="/" class="brand-logo">
        <img src="assets/images/logo.png" alt="BoardRoom" class="header-logo-img">
      </a>

      <!-- Actions (Right) -->
      <div class="masthead-actions">
        <a class="btn-gold" routerLink="/network" (click)="isMobileMenuOpen = false">MEMBERSHIP</a>
      </div>
    </div>
  </div>

  <!-- Tier 3: Primary Navigation Bar -->
  <nav class="primary-nav-bar" [class.mobile-open]="isMobileMenuOpen">
    <div class="container nav-inner">
      <ul class="nav-list">
        <li *ngFor="let item of navItems">
          <a [routerLink]="item.route" (click)="isMobileMenuOpen = false" routerLinkActive="active" [routerLinkActiveOptions]="{exact: item.route === '/'}">{{ item.label }}</a>
        </li>
      </ul>
      <button class="icon-btn nav-search-btn" (click)="toggleSearch()" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <span class="search-label">Search</span>
      </button>
    </div>

    <!-- Search Drawer -->
    <div class="search-drawer" *ngIf="isSearchOpen">
      <div class="container search-drawer-inner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A5248" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input id="site-search" type="text" autocomplete="off" placeholder="Search articles and insights by heading…"
               [value]="query()" (input)="onQuery($event)" (keydown)="onSearchKeydown($event)"
               role="combobox" aria-expanded="true" aria-controls="search-results" />
        <button class="icon-btn" (click)="toggleSearch()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>

        <!-- Suggestions: headings that contain what has been typed so far -->
        <ul class="search-results" id="search-results" role="listbox" *ngIf="query().trim()">
          <li *ngFor="let r of results(); let i = index" role="option" [class.active]="i === activeIdx()"
              (mousedown)="$event.preventDefault(); open(r)" (mouseenter)="activeIdx.set(i)">
            <span class="r-title"><ng-container *ngFor="let p of parts(r.title)"><b *ngIf="p.hit; else plain">{{ p.text }}</b><ng-template #plain>{{ p.text }}</ng-template></ng-container></span>
            <span class="r-meta"><em>{{ r.type }}</em> · {{ r.category }}</span>
          </li>
          <li class="none" *ngIf="results().length === 0">No headings match “{{ query().trim() }}”.</li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Tier 4: Live Market Ticker Strip -->
  <div class="market-ticker-bar" *ngIf="showTicker">
    <div class="container ticker-inner">
      <ng-container *ngFor="let t of marketTickers; let last = last">
        <div class="ticker-item">
          <span>{{ t.name }}</span>
          <span *ngIf="t.value">{{ t.value }}</span>
          <span class="ticker-indicator" [class.up]="t.isPositive" [class.down]="!t.isPositive">
            {{ t.isPositive ? '▲' : '▼' }} {{ t.change }}
          </span>
        </div>
        <span class="ticker-sep" *ngIf="!last">/</span>
      </ng-container>
    </div>
  </div>
</header>
