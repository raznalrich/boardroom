<div class="confirm-backdrop" (click)="cancel()">
  <section class="confirm-dialog" role="alertdialog" aria-modal="true"
    aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-description"
    (click)="$event.stopPropagation()">
    <h3 id="confirm-dialog-title">{{ heading() }}</h3>
    <p id="confirm-dialog-description">{{ message() }}</p>
    <div class="confirm-actions">
      <button type="button" class="btn" (click)="cancel()" [disabled]="busy()">Cancel</button>
      <button type="button" class="btn danger" (click)="confirm()" [disabled]="busy()">
        {{ busy() ? pendingLabel() : confirmLabel() }}
      </button>
    </div>
  </section>
</div>
